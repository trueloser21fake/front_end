<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h4>Lista não ordenada:</h4>
    <ul>
        <li type="star">Item A</li>
        <li type="star">Item B</li>
        <li type="star">Item C</li>
    </ul>
    <h4>Lista ordenada:</h4>
    <ol>
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li>
    </ol>



</body>

</html>
